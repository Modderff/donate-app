<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<title>Boshqaruv paneli — Donat qo'shish</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #0f0f14;
    color: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    padding: 30px 16px;
  }
  .wrap { width: 380px; }
  h2 { text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 20px; }
  form {
    background: #1a1a22;
    padding: 26px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  label { display: block; margin: 12px 0 6px; font-size: 14px; color: #aaa; }
  input, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #101018;
    color: white;
    box-sizing: border-box;
    font-size: 15px;
  }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
  }
  #status { margin-top: 10px; text-align: center; font-size: 14px; min-height: 18px; }

  .pending-box {
    margin-top: 24px;
    background: #1a1a22;
    border-radius: 16px;
    padding: 16px 20px;
  }
  .pending-box h3 { margin: 0 0 10px; font-size: 15px; color: #fbbf24; }
  .pending-item {
    background: #101018;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .pending-item .top { display: flex; justify-content: space-between; align-items: center; }
  .pending-item .name { font-weight: 700; }
  .pending-item .amount { color: #4ade80; font-weight: 700; }
  .pending-item .msg { color: #aaa; font-size: 13px; margin: 6px 0 10px; }
  .pending-item .actions { display: flex; gap: 8px; }
  .pending-item button {
    flex: 1;
    margin: 0;
    padding: 8px;
    font-size: 13px;
  }
  .btn-approve { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .btn-reject { background: #3f3f46; }
  #empty-pending { color: #666; font-size: 13px; }

  .history {
    margin-top: 24px;
    background: #1a1a22;
    border-radius: 16px;
    padding: 16px 20px;
  }
  .history h3 { margin: 0 0 10px; font-size: 15px; color: #aaa; }
  .item { padding: 8px 0; border-bottom: 1px solid #2a2a33; font-size: 14px; }
  .item:last-child { border-bottom: none; }
  .item b { color: #4ade80; }
</style>
</head>
<body>

<div class="wrap">
  <h2>🎛️ Boshqaruv paneli</h2>
  <div class="sub">Pul kartangizga tushganini tasdiqlagach, shu yerdan kiriting</div>

  <div class="pending-box">
    <h3>⏳ Kutayotgan so'rovlar (tomoshabinlardan)</h3>
    <div id="pending-list"><div id="empty-pending">Hozircha yo'q</div></div>
  </div>

  <form id="admin-form">
    <h3 style="margin-top:0; font-size:15px; color:#aaa;">✍️ Qo'lda kiritish (masalan, Telegram orqali kelgan)</h3>

    <label>Tomoshabin ismi</label>
    <input type="text" id="name" required maxlength="40" placeholder="Masalan: Aziz" />

    <label>Summa (so'm)</label>
    <input type="number" id="amount" required min="1000" placeholder="20000" />

    <label>Xabar (ixtiyoriy)</label>
    <textarea id="message" maxlength="200" rows="2" placeholder="Tomoshabin yozgan xabar..."></textarea>

    <button type="submit">✅ Tasdiqlash va ekranga chiqarish</button>
    <div id="status"></div>
  </form>

  <div class="history">
    <h3>So'nggi kiritilganlar</h3>
    <div id="history-list">Yuklanmoqda...</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const form = document.getElementById("admin-form");
  const status = document.getElementById("status");
  const historyList = document.getElementById("history-list");
  const pendingList = document.getElementById("pending-list");

  const pendingItems = {};

  function renderPending() {
    const ids = Object.keys(pendingItems);
    if (ids.length === 0) {
      pendingList.innerHTML = '<div id="empty-pending">Hozircha yo\'q</div>';
      return;
    }
    pendingList.innerHTML = ids.map((id) => {
      const p = pendingItems[id];
      return `
        <div class="pending-item" data-id="${id}">
          <div class="top">
            <span class="name">${p.name}</span>
            <span class="amount">${Number(p.amount).toLocaleString()} so'm</span>
          </div>
          ${p.message ? `<div class="msg">${p.message}</div>` : ""}
          <div class="actions">
            <button class="btn-approve" onclick="approveItem(${id})">✅ Tasdiqlash</button>
            <button class="btn-reject" onclick="rejectItem(${id})">✖ Rad etish</button>
          </div>
        </div>
      `;
    }).join("");
  }

  async function approveItem(id) {
    await fetch(`/api/approve/${id}`, { method: "POST" });
  }

  async function rejectItem(id) {
    await fetch(`/api/reject/${id}`, { method: "POST" });
  }

  socket.on("new-pending", (item) => {
    pendingItems[item.id] = item;
    renderPending();
  });

  socket.on("pending-removed", (id) => {
    delete pendingItems[id];
    renderPending();
    loadHistory();
  });

  async function loadPending() {
    const res = await fetch("/api/pending");
    const items = await res.json();
    items.forEach((p) => (pendingItems[p.id] = p));
    renderPending();
  }

  async function loadHistory() {
    try {
      const res = await fetch("/api/donations");
      const items = await res.json();
      if (items.length === 0) {
        historyList.textContent = "Hali hech narsa yo'q";
        return;
      }
      historyList.innerHTML = items.map(d => `
        <div class="item">
          <b>${d.name}</b> — ${Number(d.amount).toLocaleString()} so'm
          ${d.message ? `<br><span style="color:#888">${d.message}</span>` : ""}
        </div>
      `).join("");
    } catch (e) {
      historyList.textContent = "Yuklab bo'lmadi";
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    status.textContent = "Yuborilmoqda...";

    const payload = {
      name: document.getElementById("name").value,
      amount: document.getElementById("amount").value,
      message: document.getElementById("message").value,
    };

    try {
      const res = await fetch("/api/donate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (data.success) {
        status.textContent = "✅ Ekranga chiqarildi!";
        form.reset();
        loadHistory();
      } else {
        status.textContent = "❌ Xatolik: " + (data.error || "noma'lum");
      }
    } catch (err) {
      status.textContent = "❌ Server bilan bog'lanib bo'lmadi";
    }
  });

  loadHistory();
  loadPending();
</script>

</body>
</html>
